[package]
name = "rbh-backup"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "External backup adapter trait + rbhext_tool-compatible subprocess implementation."

[dependencies]
lustre-api = { path = "../lustre-api" }
rbh-entry-store = { path = "../rbh-entry-store" }

async-trait = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "process"] }
tempfile = "3"
