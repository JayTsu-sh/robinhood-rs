[package]
name = "rbh-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "policy resources, execution and classifiers."

[dependencies]
lustre-api = { path = "../lustre-api" }
rbh-entry-store = { path = "../rbh-entry-store" }
rbh-predicate = { path = "../rbh-predicate" }
scheduler-rs = { git = "ssh://git@github.com/JayTsu-sh/scheduler-rs.git" }

async-trait = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonschema = { version = "0.63", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = "0.1"
sha2 = "0.10"
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
bytes = { workspace = true }
lustre-api = { path = "../lustre-api" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
