name: Compose smoke

on: pull_request

permissions:
  contents: read

jobs:
  compose-smoke:
    name: Build and test the Compose image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run the no-mount end-to-end test
        run: bash tests/e2e-compose.sh
